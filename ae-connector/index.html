<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Claude Connector</title>
  <link rel="stylesheet" href="css/style.css"/>
</head>
<body>

  <!-- API Key Setup -->
  <div id="apiKeySection" class="api-section">
    <div class="api-header">
      <span class="logo">&#9670; Claude Connector</span>
    </div>
    <div class="api-body">
      <label for="apiKeyInput">Anthropic API Key</label>
      <input type="password" id="apiKeyInput" placeholder="sk-ant-..." autocomplete="off"/>
      <button id="saveKeyBtn" class="btn-primary">Save &amp; Connect</button>
    </div>
  </div>

  <!-- Main Chat Panel -->
  <div id="chatPanel" class="chat-panel hidden">

    <!-- Header -->
    <div class="chat-header">
      <span class="logo">&#9670; Claude Connector</span>
      <button id="settingsBtn" class="icon-btn" title="Settings">&#9881;</button>
    </div>

    <!-- Status bar -->
    <div id="statusBar" class="status-bar">
      <span id="statusDot" class="dot dot-idle"></span>
      <span id="statusText">Ready</span>
    </div>

    <!-- Message thread -->
    <div id="messages" class="messages">
      <div class="msg bot">
        <div class="bubble">
          Hey! I'm your Claude connector for After Effects.<br/><br/>
          You can tell me things like:<br/>
          <span class="hint">"add a glow effect to the selected layer"</span><br/>
          <span class="hint">"apply xrh4 style"</span><br/>
          <span class="hint">"follow https://youtube.com/watch?v=..."</span><br/>
          <span class="hint">"apply preset Cinematic"</span>
        </div>
      </div>
    </div>

    <!-- Quick-action chips -->
    <div class="chips">
      <button class="chip" data-fill="apply xrh4 style to selected layer">xrh4 style</button>
      <button class="chip" data-fill="apply 24kjohn style to selected layer">24kjohn style</button>
      <button class="chip" data-fill="apply gulovsky style to selected layer">gulovsky style</button>
      <button class="chip chip-tutorial" data-fill="follow ">Follow tutorial&hellip;</button>
    </div>

    <!-- Input row -->
    <div class="input-row">
      <textarea id="userInput" placeholder="Ask Claude to edit your project..." rows="2"></textarea>
      <button id="sendBtn" class="send-btn">&#9658;</button>
    </div>

  </div>

  <!-- Tutorial progress overlay -->
  <div id="tutorialOverlay" class="tutorial-overlay hidden">
    <div class="tutorial-box">
      <div class="tutorial-title">Following Tutorial</div>
      <div id="tutorialProgress" class="tutorial-progress"></div>
      <div id="tutorialStep" class="tutorial-step">Fetching transcript...</div>
      <button id="cancelTutorial" class="btn-danger">Cancel</button>
    </div>
  </div>

  <script src="js/lib/CSInterface.js"></script>
  <script src="js/claude.js"></script>
  <script src="js/youtube.js"></script>
  <script src="js/presets.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
